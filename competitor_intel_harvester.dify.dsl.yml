      - id: parse_started_job
        type: custom
        data:
          type: code
          title: 整理新任务结果
          desc: "返回任务 ID、状态接口和最终文件下载链接。"
          selected: false
          code_language: python3
          variables:
            - variable: body
              value_selector:
                - start_collection_job
                - body
            - variable: status_code
              value_selector:
                - start_collection_job
                - status_code
            - variable: base_url
              value_selector:
                - start
                - harvester_base_url
            - variable: env_body
              value_selector:
                - check_environment
                - body
          outputs:
            summary_markdown:
              type: string
              children: null
            job_id:
              type: string
              children: null
            status:
              type: string
              children: null
            out_dir:
              type: string
              children: null
            status_url:
              type: string
              children: null
            report_url:
              type: string
              children: null
            sources_url:
              type: string
              children: null
            unfiltered_url:
              type: string
              children: null
            filtered_url:
              type: string
              children: null
            principles_url:
              type: string
              children: null
            review_queue_url:
              type: string
              children: null
            artifacts_text:
              type: string
              children: null
            raw_json:
              type: string
              children: null
          code: |
            import json
            from urllib.parse import quote

            REPORT = "竞品分析报告_图片内嵌版.md"
            SOURCES = "所有采集来源.csv"
            UNFILTERED = "未经筛选的采集内容.md"
            FILTERED = "筛选后的采集内容.md"
            PRINCIPLES = "采集原则和筛选原则.md"
            REVIEW = "人工复核队列.md"
            TRAINING_SAMPLE = "人工抽样标注表.csv"
            ML_STATUS = "本地筛选模型状态.json"

            def _read_json(body):
                if isinstance(body, dict):
                    return body
                try:
                    return json.loads(body or "{}")
                except Exception:
                    return {"parse_error": True, "raw_body": str(body or "")[:4000]}

            def _download_url(base_url, job_id, filename):
                if not base_url or not job_id:
                    return ""
                return f"{base_url.rstrip('/')}/download?job={quote(str(job_id))}&file={quote(filename)}"

            def main(body: str, status_code: int, base_url: str, env_body: str) -> dict:
                data = _read_json(body)
                env = _read_json(env_body)
                job_id = str(data.get("id") or "")
                status = str(data.get("status") or "unknown")
                out_dir = str(data.get("out_dir") or "")
                artifacts = data.get("artifacts") or []
                if isinstance(artifacts, list):
                    artifacts_text = "\n".join([f"- {item}" for item in artifacts])
                else:
                    artifacts_text = str(artifacts)

                status_url = f"{base_url.rstrip('/')}/api/jobs/{quote(job_id)}" if job_id else ""
                report_url = _download_url(base_url, job_id, REPORT)
                sources_url = _download_url(base_url, job_id, SOURCES)
                unfiltered_url = _download_url(base_url, job_id, UNFILTERED)
                filtered_url = _download_url(base_url, job_id, FILTERED)
                principles_url = _download_url(base_url, job_id, PRINCIPLES)
                review_queue_url = _download_url(base_url, job_id, REVIEW)
                training_sample_url = _download_url(base_url, job_id, TRAINING_SAMPLE)
                ml_status_url = _download_url(base_url, job_id, ML_STATUS)

                elapsed = data.get("elapsed_label") or data.get("duration_label") or ""
                command = data.get("command") or ""
                logs = data.get("logs") or ""
                if isinstance(logs, list):
                    logs_tail = "\n".join(logs[-20:])
                else:
                    logs_tail = str(logs)[-3000:]

                env_lines = []
                if isinstance(env, dict):
                    for key in ["status", "searxng", "proxy", "crawl4ai", "icrawler", "python"]:
                        if key in env:
                            env_lines.append(f"- {key}: {env.get(key)}")
                if not env_lines:
                    env_lines.append("- 环境检查结果未返回或无法解析。")

                if not job_id:
                    error = data.get("error") or data.get("message") or data.get("raw_body") or "未返回任务 ID。"
                    lines = [
                        "## 竞品情报采集任务未启动",
                        "",
                        f"- HTTP 状态码：{status_code}",
                        f"- 错误信息：{error}",
                        "",
                        "### 环境检查",
                        *env_lines,
                        "",
                        "### 原始响应",
                        "```json",
                        json.dumps(data, ensure_ascii=False, indent=2),
                        "```",
                    ]
                else:
                    lines = [
                        "## 竞品情报采集任务已启动",
                        "",
                        f"- HTTP 状态码：{status_code}",
                        f"- 任务 ID：{job_id}",
                        f"- 当前状态：{status}",
                        f"- 已耗时：{elapsed or '刚启动'}",
                        f"- 输出目录：{out_dir or '任务完成后返回'}",
                        "",
                        "### 下一步",
                        "任务在本地采集器后台继续运行。稍后用同一个 Dify 应用填写“查询已有任务 ID”，即可查看完成状态和下载文件。",
                        "",
                        "### 常用链接",
                        f"- 状态查询：{status_url}",
                        f"- 分析报告：{report_url}",
                        f"- 所有采集来源：{sources_url}",
                        f"- 未经筛选内容：{unfiltered_url}",
                        f"- 筛选后内容：{filtered_url}",
                        f"- 采集和筛选原则：{principles_url}",
                        f"- 人工复核队列：{review_queue_url}",
                        f"- 人工抽样标注表：{training_sample_url}",
                        f"- 本地筛选模型状态：{ml_status_url}",
                        "",
                        "### 环境检查",
                        *env_lines,
                        "",
                        "### 已发现产物",
                        artifacts_text or "任务刚启动，暂无产物列表。",
                        "",
                        "### 最近日志",
                        "```text",
                        logs_tail or "任务刚启动，暂无日志。",
                        "```",
                    ]
                    if command:
                        lines.extend(["", "### 本地执行命令", "```text", str(command), "```"])

                return {
                    "summary_markdown": "\n".join(lines),
                    "job_id": job_id,
                    "status": status,
                    "out_dir": out_dir,
                    "status_url": status_url,
                    "report_url": report_url,
                    "sources_url": sources_url,
                    "unfiltered_url": unfiltered_url,
                    "filtered_url": filtered_url,
                    "principles_url": principles_url,
                    "review_queue_url": review_queue_url,
                    "artifacts_text": artifacts_text,
                    "raw_json": json.dumps(data, ensure_ascii=False, indent=2),
                }
