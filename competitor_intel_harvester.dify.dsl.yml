                要求：
                1. 先说明任务是否已成功启动。
                2. 明确任务 ID，提醒后续可以用同一个 Dify 应用查询。
                3. 列出最终报告、采集来源、筛选内容等下载入口。
                4. 如果环境检查或启动失败，直接指出原因和下一步处理建议。

                新建任务结果：
                {{#parse_started_job.summary_markdown#}}
