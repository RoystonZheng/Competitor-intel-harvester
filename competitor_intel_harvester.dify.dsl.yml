        data:
          type: http-request
          title: 环境检查
          desc: "检查 SearXNG、代理、Crawl4AI、icrawler 和 Python 环境。"
          selected: false
          variables: []
          method: get
          url: "{{#start.harvester_base_url#}}/api/check"
          headers: ""
          params: "searxng_url={{#start.searxng_url#}}&proxy_url={{#start.proxy_url#}}"
          body:
            type: none
            data: []
          authorization:
            type: no-auth
          timeout:
            connect: 10
            read: 60
            write: 10
          retry_config:
            retry_enabled: false
        position:
          x: 700
          y: 360
        positionAbsolute:
          x: 700
          y: 360
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 120
